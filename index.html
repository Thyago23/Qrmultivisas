<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multivisa · Asesoría Migratoria</title>
  <meta name="description" content="Seguí a Multivisa, asesoría migratoria, en nuestras redes sociales.">
  <meta name="theme-color" content="#1F1E5F">
  <link rel="icon" type="image/png" href="logo.png">
  <meta property="og:title" content="Multivisa · Asesoría Migratoria">
  <meta property="og:description" content="Encontranos en TikTok, Instagram y Facebook.">
  <meta property="og:image" content="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #1F1E5F;
      --navy-dark: #15144A;
      --pink: #F00064;
      --pink-2: #F10077;
      --bg: #F7F7F7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "Montserrat", system-ui, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(240,0,100,.35), transparent 45%),
        radial-gradient(circle at 90% 95%, rgba(240,0,100,.25), transparent 40%),
        linear-gradient(160deg, var(--navy) 0%, var(--navy-dark) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      color: var(--navy);
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--bg);
      border-radius: 28px;
      padding: 32px 24px 28px;
      box-shadow: 0 24px 60px rgba(0,0,0,.35);
      text-align: center;
      animation: up .6s ease-out both;
    }
    .logo {
      width: 220px;
      max-width: 70%;
      height: auto;
      display: block;
      margin: 0 auto 12px;
    }
    .tagline {
      font-weight: 500;
      font-size: .95rem;
      color: var(--navy);
      opacity: .8;
      margin-bottom: 24px;
    }
    .links { display: flex; flex-direction: column; gap: 14px; }
    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      color: #fff;
      background: var(--navy);
      border: 2px solid var(--navy);
      transition: transform .15s ease, background .2s ease, box-shadow .2s ease;
      animation: up .5s ease-out both;
    }
    .link:nth-child(1) { animation-delay: .15s; }
    .link:nth-child(2) { animation-delay: .25s; }
    .link:nth-child(3) { animation-delay: .35s; }
    .link:hover, .link:focus-visible {
      background: var(--pink);
      border-color: var(--pink);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(240,0,100,.35);
      outline: none;
    }
    .link:active { transform: scale(.98); }
    .icon {
      width: 40px; height: 40px;
      flex-shrink: 0;
      border-radius: 12px;
      background: rgba(255,255,255,.12);
      display: grid; place-items: center;
    }
    .icon svg { width: 22px; height: 22px; fill: #fff; }
    .label { flex: 1; text-align: left; }
    .label small { display: block; font-weight: 500; font-size: .8rem; opacity: .75; }
    .arrow { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2.5; opacity: .8; }
    footer {
      margin-top: 24px;
      font-size: .75rem;
      color: var(--navy);
      opacity: .6;
    }
    footer span { color: var(--pink); font-weight: 700; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .card, .link { animation: none; } }
  </style>
</head>

</body>
